version: '3.8'

services:
  # Prometheus - сбор и хранение метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - визуализация метрик
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  # Redis Exporter - метрики Redis (ОПЦИОНАЛЬНО)
  # Раскомментируйте, если нужны метрики Redis
  # ВАЖНО: Если Redis не установлен, закомментируйте весь блок redis_exporter
  # redis_exporter:
  #   image: oliver006/redis_exporter:latest
  #   container_name: redis_exporter
  #   ports:
  #     - "9121:9121"
  #   environment:
  #     - REDIS_ADDR=127.0.0.1:6379
  #   network_mode: host
  #   restart: unless-stopped

  # MySQL Exporter - метрики MySQL (ОПЦИОНАЛЬНО)
  # Раскомментируйте, если нужны метрики MySQL
  # ВАЖНО: Если MySQL не установлен, закомментируйте весь блок mysql_exporter
  # mysql_exporter:
  #   image: prom/mysqld-exporter:latest
  #   container_name: mysql_exporter
  #   ports:
  #     - "9104:9104"
  #   environment:
  #     - DATA_SOURCE_NAME=${DB_USER}:${DB_PASSWORD}@(127.0.0.1:3306)/${DB_NAME}
  #   network_mode: host
  #   restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge

